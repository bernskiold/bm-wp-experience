name: Tests

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: tests-${{ github.ref }}
    cancel-in-progress: true

jobs:
    tests:
        uses: bernskiold/.github/.github/workflows/wordpress-plugin-tests.yml@main
        with:
            php-versions: '["8.2","8.3","8.4","8.5"]'
            # Drop 7.2-RC3 once 7.2 is released and "latest" picks it up.
            wp-versions: '["7.0","latest","7.2-RC3"]'
            js-unit: true
            # `composer lint` runs PHPStan (formerly the QA workflow).
            php-lint: true
            js-lint: true
            check-dist: true
            # Imagick renders the 2FA QR code; without it those tests skip.
            php-extensions: 'mysqli, imagick'

    # WordPress 7.0 core calls spl_object_hash(), which errors on PHP 8.6,
    # so PHP 8.6 runs against the latest WordPress only.
    tests-php-8-6:
        uses: bernskiold/.github/.github/workflows/wordpress-plugin-tests.yml@main
        with:
            php-versions: '["8.6"]'
            wp-versions: '["latest"]'
            php-extensions: 'mysqli, imagick'
