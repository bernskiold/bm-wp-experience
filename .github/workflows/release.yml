name: Build Release

on:
    release:
        types: [published]

permissions:
    contents: write

jobs:
    release:
        uses: bernskiold/.github/.github/workflows/wordpress-plugin-release.yml@main
        with:
            version-files: |
                src/Plugin.php
            # The plugin needs its runtime Composer dependencies (Google2FA,
            # BaconQrCode, Postal, the update checker) and autoloader.
            composer: true
